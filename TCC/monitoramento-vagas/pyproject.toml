[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoramento-vagas"
version = "1.0.0"
description = "Monitoramento contínuo de vagas e integração REST com Parking FAG"
requires-python = ">=3.12,<3.14"
dependencies = ["requests==2.34.2", "opencv-python==4.12.0.88", "numpy==2.2.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
parking-monitor = "parking_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
